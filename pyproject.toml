[project]
name = "local-secretary"
version = "0.2.2"
description = "공유형 개인 비서 & 대시보드 — 노트 기반 일정 추적 (로컬 LLM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "python-dateutil>=2.9",
  "holidays>=0.50",
  "httpx>=0.27",
  "watchdog>=4.0",
  # Windows에는 IANA 시간대 DB가 없어서 zoneinfo가 이 패키지를 쓴다.
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
local-secretary = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
